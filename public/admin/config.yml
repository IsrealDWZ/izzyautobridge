backend:
  name: github
  repo: IsrealDWZ/izzyautobridge
  branch: master
  proxy_url: https://izzyautobridge.vercel.app/api/auth/github
  use_graphql: true

media_folder: "images_custom"
public_folder: "/vehicles"
media_library:
  config:
    multiple: true

collections:
  - name: "vehicles"
    label: "Vehicles"
    folder: "src/data"
    create: false
    slug: "vehicles"
    fields:
      - label: "Vehicles Array"
        name: "vehicles"
        widget: "list"
        fields:
          - {label: "ID", name: "ID", widget: "string", required: true}
          - {label: "Brand", name: "Brand", widget: "string", required: true}
          - {label: "Model", name: "Model", widget: "string", required: true}
          - {label: "Year", name: "Year", widget: "number", required: true}
          - {label: "Variant", name: "Variant", widget: "string", required: false}
          - {label: "Fuel Type", name: "Fuel_Type", widget: "select", options: ["Petrol", "Diesel", "Hybrid", "Electric", "PHEV", "Pure electric"], required: true}
          - {label: "Body Type", name: "Body_Type", widget: "select", options: ["SUV", "Sedan", "Hatchback", "MPV", "Pickup", "Mini", "Van/Minibus", "Coupe", "Truck", "Bus", "Motorcycle", "Scooter"], required: true}
          - {label: "Drive", name: "Drive", widget: "select", options: ["FWD", "RWD", "AWD", "4WD", "Unknown"], required: true}
          - {label: "Color", name: "Color", widget: "string", required: true}
          - {label: "Status", name: "Status", widget: "select", options: ["Brand new", "Available", "Used", "In Transit", "Reserved", "Sold"], required: true}
          - {label: "Mileage (km)", name: "Mileage_km", widget: "number", required: true, default: 0}
          - {label: "Price USD", name: "Price_USD", widget: "number", required: true}
          - {label: "Price GHS", name: "Price_GHS", widget: "number", required: true}
          - {label: "Key Specs", name: "Key_Specs", widget: "text", required: true}
          - label: "Images"
            name: "Image_URLs"
            widget: "list"
            field: {label: "Image", name: "image", widget: "image", choose_url: true, media_library: {config: {multiple: true}}}

  - name: "site_settings"
    label: "Site Settings"
    files:
      - name: "settings"
        label: "General Settings"
        file: "src/data/site_settings.json"
        fields:
          - {label: "Site Title", name: "site_title", widget: "string", default: "IzzyAutoBridge Ghana"}
          - {label: "WhatsApp Number", name: "whatsapp_number", widget: "string", default: "233536225804"}
          - {label: "Tagline", name: "tagline", widget: "string", default: "Direct China Vehicle Supply"}
          - {label: "Hero Title", name: "hero_title", widget: "string", default: "Your car, bridged to Ghana."}
          - {label: "Hero Subtitle", name: "hero_subtitle", widget: "text", default: "194+ inspected vehicles from China. Transparent landed costs, 12-month warranty, and a route you can actually track from port to your driveway."}