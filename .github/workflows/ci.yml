name: CI

on:
  push:
    branches: [master, main]
    paths-ignore:
      - 'src/data/exchange-rate.json'
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Blocks on shipped dependencies only. Dev-only advisories (vite/vitest
      # toolchain) are reported in the next step so they stay visible without
      # breaking every push; fixing them needs a vitest major upgrade.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all dependencies (informational)
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Build data part
        run: npm run build:data

      - name: Verify catalog non-empty
        run: |
          echo "Published vehicles: $(node -e "const v = require('./src/data/vehicles.json'); console.log(v.length)")"
          MIN=129
          ACTUAL=$(node -e "const v = require('./src/data/vehicles.json'); console.log(v.length)")
          if [ "$ACTUAL" -lt "$MIN" ]; then
            echo "❌ Catalog has $ACTUAL vehicles, expected at least $MIN"
            exit 1
          fi
          echo "✅ Catalog has $ACTUAL vehicles (minimum $MIN)"
